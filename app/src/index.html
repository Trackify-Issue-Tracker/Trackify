<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trackify</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before the first paint to avoid a flash of the wrong one
    try {
      var mode = localStorage.getItem('trackify-theme');
      var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
